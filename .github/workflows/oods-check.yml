name: oods-check

# Shape-only today: pulls the pinned app image as a live smoke test that the image this repo
# depends on actually runs, then checks data/oods/ against the file formats MIP-0056 specifies.
# Real validation — the app's own OODS command reading and checking the data, not just its file
# extensions — replaces the smoke command and the shape check once the MIP-0056 ingest stack lands
# in marola-app (docs/3-development.md). Never writes to this repo: data/ only ever changes through
# marola-app's oods-ingest.yml committing here.

on:
  push:
    branches: [main]
    paths: [data/**, marola-image, .github/workflows/oods-check.yml]
  pull_request:
    paths: [data/**, marola-image, .github/workflows/oods-check.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: read # the app image is private until the maintainer flips it (MIP-0065 §4.3)

concurrency:
  group: oods-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: pull the pinned app image
        run: docker pull "$(scripts/app-image.sh)"

      # --report-sighting is local-only (LocalFileSightingStore writes inside the container's own
      # /app/data, never mounted here): no network, no Ollama, no corpus needed — the smoke the
      # image supports today. The OODS commands are not in the image yet (MIP-0056 is not merged).
      - name: smoke test — the image actually runs
        run: |
          docker run --rm "$(scripts/app-image.sh)" \
            --report-sighting jellyfish "oods-check" "smoke test, no network"

      - name: shape check data/oods/
        run: scripts/oods-tree-check.sh
