name: CI

# The devkit's reusable workflows at the pinned tag (MIP-0070 §5.6). Bump the tag here, the
# devkit-ref inputs and flake.nix's input together.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    uses: marola-dev/marola-devkit/.github/workflows/static-ci.yml@v0.10.0
    with:
      shellcheck-files: scripts/*.sh
      extra-commands: |
        scripts/oods-tree-check.sh
        scripts/oods-tree-check.sh --self-test
        scripts/app-image.sh --self-test
        git -c advice.detachedHead=false clone -q --depth 1 -b v0.10.0 https://github.com/marola-dev/marola-devkit /tmp/devkit && python3 /tmp/devkit/scripts/docs_lint.py .

  agents:
    uses: marola-dev/marola-devkit/.github/workflows/agents-check.yml@v0.10.0
    with:
      devkit-ref: v0.10.0

  # The one check ci-rule requires in every marola repo (marola-dev/marola#813); it must report on
  # every run, so it needs every other job and passes on skipped ones.
  ci-ok:
    if: always()
    needs: [static, agents]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a needed job ended $r"; exit 1 ;; esac
          done
