# Tells the devkit this repo's devkit-bump CI is green, so bump-merge runs within minutes (marola-dev/marola#859).
name: bump ready

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ['chore/devkit-v*']

permissions: {}

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    uses: marola-dev/marola-devkit/.github/workflows/notify-devkit.yml@v0.20.3
    secrets:
      pr_bot_key: ${{ secrets.PR_BOT_KEY }}
