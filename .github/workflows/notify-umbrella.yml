name: notify umbrella

# Every push to main tells the umbrella: submodule-updated, so pointer-sync moves this repo's
# pointer, and submodule-docs-updated too when README.md or docs/ changed (MIP-0076 §5.5).
# No token set: a notice, and the umbrella's daily cron picks the change up.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  notify:
    uses: marola-dev/marola-devkit/.github/workflows/notify-umbrella.yml@v0.8.0
    secrets:
      token: ${{ secrets.MAROLA_CROSS_REPO_PAT }}
